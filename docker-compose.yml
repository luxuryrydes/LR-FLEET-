# Local / single-server stack: PostgreSQL + Java API + Python worker sharing a private file volume.
#   cp .env.example .env   (then edit the values)
#   docker compose up --build
# Frontend: cd frontend && npm install && npm run dev  ->  http://localhost:5173  (proxies /api to :8080)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: ${DB_USERNAME:-fleet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fleet} -d fleet"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fleet
      DB_USERNAME: ${DB_USERNAME:-fleet}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_TYPE: local
      STORAGE_LOCAL_DIR: /data/files
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      WORKER_DATABASE_URL: postgresql://${DB_USERNAME:-fleet}:${DB_PASSWORD}@db:5432/fleet
      STORAGE_TYPE: local
      STORAGE_LOCAL_DIR: /data/files
    volumes:
      - files:/data/files

volumes:
  pgdata:
  files:

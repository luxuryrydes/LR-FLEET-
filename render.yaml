# Render Blueprint: Java API (web service) + Python import worker (background worker).
# Database: Supabase PostgreSQL. Files: Supabase Storage (S3-compatible, private bucket).
# In Render: New + -> Blueprint -> select this repository. Fill in every "sync: false" value when prompted.
services:
  - type: web
    name: lr-fleet-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false            # jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        sync: false            # postgres.<project-ref>
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "8"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false            # https://your-app.vercel.app (comma-separate several)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false            # used only to create the first admin when no users exist; change it after first login
      - key: STORAGE_TYPE
        value: s3
      - key: S3_BUCKET
        value: fleet-files
      - key: S3_ENDPOINT
        sync: false            # https://<project-ref>.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-south-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Kolkata"

  - type: worker
    name: lr-fleet-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    autoDeploy: true
    envVars:
      - key: WORKER_DATABASE_URL
        sync: false            # postgresql://postgres.<ref>:<password>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: STORAGE_TYPE
        value: s3
      - key: S3_BUCKET
        value: fleet-files
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: TZ
        value: Asia/Kolkata
